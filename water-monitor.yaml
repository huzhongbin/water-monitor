esphome:
  name: water-monitor
  friendly_name: 净水器监测
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: Mijia
  password: 09081005
  ap:
    ssid: Water-Monitor-AP
    password: "12345678"

ota:
  - platform: esphome
    password: "12345678"
  - platform: web_server

api:
  reboot_timeout: 0s

web_server:
  port: 80

logger:
  level: INFO

# I2C总线 用于ADS1115模数采集芯片
i2c:
  sda: GPIO7
  scl: GPIO6
  scan: true

# ADS1115 4通道ADC芯片，采集压力、NTC温度模拟量
ads1115:
  address: 0x48

# UART串口：对接双通道TDS电导率水质模块V1.1
uart:
  - id: tds_uart
    tx_pin: GPIO10
    rx_pin: GPIO3
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 256
    debug:
      direction: RX
      dummy_receiver: true
      after:
        bytes: 11
      sequence:
        - lambda: |-
            auto &buf = bytes;
            if(buf.size()>=11 && buf[0]==0x55) {
              uint8_t ch = buf[3];
              uint16_t ec_raw = (buf[4] << 8) | buf[5];
              uint16_t temp_raw = (buf[6] << 8) | buf[7];
              float ec = ec_raw / 10.0f;
              float t = temp_raw /10.0f;
              float tds_val = ec / 2.0f;

              if(ch == 1){
                id(ec_in).publish_state(ec);
                id(tds_in).publish_state(tds_val);
                id(tds_temp_in).publish_state(t);
              }else if(ch ==2){
                id(ec_pure).publish_state(ec);
                id(tds_pure).publish_state(tds_val);
                id(tds_temp_pure).publish_state(t);
              }
            }

# 全局断电保存变量
globals:
  - id: filter1_total
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: filter2_total
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: filter3_total
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: filter4_total
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: high_pressure_start_time
    type: int
    restore_value: no
    initial_value: "0"
  - id: tds_channel_sel
    type: uint8_t
    restore_value: no
    initial_value: '1'


# 网络时间同步，用于高压开关计时
time:
  - platform: sntp
    id: sys_time
    servers: ntp.aliyun.com
    timezone: "CST-8"

# 滤芯容量设置，HA前端可修改，断电保存
number:
  - platform: template
    name: "滤芯1总容量01"
    id: filter1_cap
    optimistic: true
    initial_value: 6000
    min_value: 1000
    max_value: 20000
    step: 100
    restore_value: true
  - platform: template
    name: "滤芯2总容量02"
    id: filter2_cap
    optimistic: true
    initial_value: 6000
    min_value: 1000
    max_value: 20000
    step: 100
    restore_value: true
  - platform: template
    name: "滤芯3总容量03"
    id: filter3_cap
    optimistic: true
    initial_value: 12000
    min_value: 1000
    max_value: 30000
    step: 100
    restore_value: true
  - platform: template
    name: "滤芯4总容量04"
    id: filter4_cap
    optimistic: true
    initial_value: 8000
    min_value: 1000
    max_value: 20000
    step: 100
    restore_value: true

# 二进制输入传感器：高压压力开关
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
      inverted: true
    name: "高压开关01"
    id: high_press_switch
    device_class: opening
    on_press:
      lambda: |-
        id(high_pressure_start_time) = id(sys_time).now().timestamp;
    on_release:
      lambda: |-
        id(high_pressure_start_time) = 0;

# 虚拟开关：手动清零4组滤芯累计用量
switch:
  - platform: template
    name: "重置滤芯1‑01"
    id: sw_reset_filter1
    turn_on_action:
      - lambda: id(filter1_total) = id(pure_total_1).state;
      - switch.turn_off: sw_reset_filter1
  - platform: template
    name: "重置滤芯2‑02"
    id: sw_reset_filter2
    turn_on_action:
      - lambda: id(filter2_total) = id(pure_total_1).state;
      - switch.turn_off: sw_reset_filter2
  - platform: template
    name: "重置滤芯3‑03"
    id: sw_reset_filter3
    turn_on_action:
      - lambda: id(filter3_total) = id(pure_total_1).state;
      - switch.turn_off: sw_reset_filter3
  - platform: template
    name: "重置滤芯4‑04"
    id: sw_reset_filter4
    turn_on_action:
      - lambda: id(filter4_total) = id(pure_total_1).state;
      - switch.turn_off: sw_reset_filter4

# 全部数值传感器
sensor:
  # 纯水流量计：瞬时流量 + 总累计流量（断电保存）
  - platform: pulse_meter
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
    internal_filter: 13us
    name: "纯水瞬时流量‑01"
    id: pure_flow_rate
    unit_of_measurement: L/min
    accuracy_decimals: 2
    filters:
      # 修正：1脉冲=0.0001938L，pulse_meter会自动完成L→L/min的换算
      - multiply: 0.0001938
    total:
      name: "纯水总流量‑02"
      id: pure_total_1
      unit_of_measurement: L
      accuracy_decimals: 1

  # 废水流量计：瞬时流量 + 总累计流量（断电保存）
  - platform: pulse_meter
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
    internal_filter: 13us
    name: "废水瞬时流量‑03"
    id: waste_flow_rate
    unit_of_measurement: L/min
    accuracy_decimals: 2
    filters:
      # 废水流量计和纯水流量计参数一致，用相同的系数
      - multiply: 0.0001938
    total:
      name: "废水总流量‑04"
      id: waste_total_1
      unit_of_measurement: L
      accuracy_decimals: 1

  # 废水比（废水/纯水百分比）
  - platform: template
    name: "废水比‑05"
    id: waste_ratio
    unit_of_measurement: "%"
    accuracy_decimals: 1

  # RO膜脱盐率，使用电导率计算
  - platform: template
    name: "RO脱盐率‑06"
    id: ro_rejection
    unit_of_measurement: "%"
    accuracy_decimals: 1

  # ADS1115 A0：进水压力传感器 0‑1MPa，公式 Vout=4*P+0.5
  - platform: ads1115
    multiplexer: A0_GND
    gain: 4.096
    name: "进水压力‑07"
    id: water_press
    unit_of_measurement: MPa
    accuracy_decimals: 3
    filters:
      - lambda: |-
          float voltage = x;
          // Vout = 4*P +0.5 → P = (Vout‑0.5)/4
          float pressure_mpa = (voltage - 0.5) / 4.0;
          if(pressure_mpa < 0) pressure_mpa = 0;
          if(pressure_mpa > 1.0) pressure_mpa =1.0;
          return pressure_mpa;

  # ADS1115  A1：管道NTC热敏电阻原始ADC值，压力传感器内置NTC QN0603X103F3380FB
  - platform: ads1115
  multiplexer: A1_GND
  gain: 4.096
  name: ntc_raw_value
  id: ntc_raw
  internal: true
  filters:
    - lambda: |-
        float adc_voltage = x;
        // 压力传感器内部自带3380000Ω下拉电阻，R25=10K，B=3380
        const float R_internal = 3380000.0F;
        const float R25 = 10000.0F;
        const float B = 3380.0F;

        float r_ntc = R_internal * adc_voltage / (4.096F - adc_voltage);

        float steinhart;
        steinhart = log(r_ntc / R25);
        steinhart /= B;
        steinhart += 1.0F / (25.0F + 273.15F);
        steinhart = 1.0F / steinhart;
        steinhart -= 273.15F;
        return steinhart;

  # 管道NTC换算后的进水温度
  - platform: template
    name: "进水温度‑08"
    id: water_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  # 进水侧电导率 uS/cm
  - platform: template
    name: "进水电导率‑09"
    id: ec_in
    unit_of_measurement: uS/cm
    accuracy_decimals: 1
  # 进水TDS，由电导率除以2计算
  - platform: template
    name: "进水TDS‑10"
    id: tds_in
    unit_of_measurement: ppm
    accuracy_decimals: 0
  # 进水TDS探头自带温度
  - platform: template
    name: "进水TDS温度‑11"
    id: tds_temp_in
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  # 纯水侧电导率 uS/cm
  - platform: template
    name: "纯水电导率‑12"
    id: ec_pure
    unit_of_measurement: uS/cm
    accuracy_decimals: 1
  # 纯水TDS，由电导率除以2计算
  - platform: template
    name: "纯水TDS‑13"
    id: tds_pure
    unit_of_measurement: ppm
    accuracy_decimals: 0
  # 纯水TDS探头自带温度
  - platform: template
    name: "纯水TDS温度‑14"
    id: tds_temp_pure
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  # 滤芯1剩余升数
  - platform: template
    name: "滤芯1剩余升数‑15"
    id: filter1_remain
    unit_of_measurement: L
    accuracy_decimals: 0
  # 滤芯2剩余升数
  - platform: template
    name: "滤芯2剩余升数‑16"
    id: filter2_remain
    unit_of_measurement: L
    accuracy_decimals: 0
  # 滤芯3剩余升数
  - platform: template
    name: "滤芯3剩余升数‑17"
    id: filter3_remain
    unit_of_measurement: L
    accuracy_decimals: 0
  # 滤芯4剩余升数
  - platform: template
    name: "滤芯4剩余升数‑18"
    id: filter4_remain
    unit_of_measurement: L
    accuracy_decimals: 0

  # 滤芯1剩余百分比
  - platform: template
    name: "滤芯1剩余百分比‑19"
    id: filter1_remain_pct
    unit_of_measurement: "%"
    accuracy_decimals: 1
  # 滤芯2剩余百分比
  - platform: template
    name: "滤芯2剩余百分比‑20"
    id: filter2_remain_pct
    unit_of_measurement: "%"
    accuracy_decimals: 1
  # 滤芯3剩余百分比
  - platform: template
    name: "滤芯3剩余百分比‑21"
    id: filter3_remain_pct
    unit_of_measurement: "%"
    accuracy_decimals: 1
  # 滤芯4剩余百分比
  - platform: template
    name: "滤芯4剩余百分比‑22"
    id: filter4_remain_pct
    unit_of_measurement: "%"
    accuracy_decimals: 1

  # 高压开关持续闭合计时，单位秒，用于区分水满停机和高压故障
  - platform: template
    name: "高压持续时间‑23"
    id: high_pressure_duration
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if(!id(high_press_switch).state) return 0;
      int now_ts = id(sys_time).now().timestamp;
      int start_ts = id(high_pressure_start_time);
      if(start_ts == 0) return 0;
      int diff = now_ts - start_ts;
      return diff > 0 ? diff : 0;

# 文本状态传感器（改成中文）
text_sensor:
  - platform: template
    id: high_pressure_status_text
    name: "高压状态‑24"
    lambda: |-
      // !id(high_press_switch).state → 开关断开(水满停机)
      if(id(high_press_switch).state){
        return std::string("正常运行");
      }
      int dur = id(high_pressure_duration).state;
      if(dur < 600){
        return std::string("水满停机");
      }
      return std::string("高压故障");

  - platform: template
    name: "设备状态‑25"
    id: dev_status
    lambda: |-
      if(id(high_press_switch).state && id(high_pressure_duration).state >= 600){
        return std::string("高压故障");
      }
      return std::string("监测正常");

# 定时循环任务
interval:
  # 1000ms轮询TDS模块
  - interval: 1000ms
    then:
      - lambda: |-
          uint8_t cmd[8] = {0x55,0x07,0x05,id(tds_channel_sel),0x00,0x00,0x00,0x00};
          uint8_t sum=0;
          for(int i=0;i<7;i++) sum += cmd[i];
          cmd[7] = sum;
          id(tds_uart).write_array(cmd,8);
          id(tds_channel_sel) = (id(tds_channel_sel)==1)?2:1;

   # 1秒更新一次：管道温度、废水比、脱盐率、4组滤芯剩余升数&剩余百分比
  - interval: 1s
    then:
      - lambda: |-
          id(water_temp).publish_state(id(ntc_raw).state);

          float pure = id(pure_total_1).state;
          float waste = id(waste_total_1).state;
          float ratio = 0;
          if(pure>0.1) ratio = (waste / pure)*100.0;
          id(waste_ratio).publish_state(ratio);

          float ein = id(ec_in).state;
          float eout = id(ec_pure).state;
          float reject = 0;
          if(ein>5) reject = ((ein - eout)/ein)*100.0;
          id(ro_rejection).publish_state(reject);

          float cap1 = id(filter1_cap).state;
          float cap2 = id(filter2_cap).state;
          float cap3 = id(filter3_cap).state;
          float cap4 = id(filter4_cap).state;

          float used1 = id(pure_total_1).state - id(filter1_total);
          float used2 = id(pure_total_1).state - id(filter2_total);
          float used3 = id(pure_total_1).state - id(filter3_total);
          float used4 = id(pure_total_1).state - id(filter4_total);

          float rem1_1 = cap1-used1;
          float rem2_1 = cap2-used2;
          float rem3_1 = cap3-used3;
          float rem4_1 = cap4-used4;

          id(filter1_remain).publish_state(rem1_1 > 0 ? rem1_1 : 0);
          id(filter2_remain).publish_state(rem2_1 > 0 ? rem2_1 : 0);
          id(filter3_remain).publish_state(rem3_1 > 0 ? rem3_1 : 0);
          id(filter4_remain).publish_state(rem4_1 > 0 ? rem4_1 : 0);

          float pct1 = cap1>0 ? 100.0 * rem1_1 / cap1 : 0;
          float pct2 = cap2>0 ? 100.0 * rem2_1 / cap2 : 0;
          float pct3 = cap3>0 ? 100.0 * rem3_1 / cap3 : 0;
          float pct4 = cap4>0 ? 100.0 * rem4_1 / cap4 : 0;

          id(filter1_remain_pct).publish_state(pct1>0?pct1:0);
          id(filter2_remain_pct).publish_state(pct2>0?pct2:0);
          id(filter3_remain_pct).publish_state(pct3>0?pct3:0);
          id(filter4_remain_pct).publish_state(pct4>0?pct4:0);
